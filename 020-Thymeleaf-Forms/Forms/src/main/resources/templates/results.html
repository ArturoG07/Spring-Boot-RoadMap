<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<p th:text="'Your name is: ' + ${user.name}"></p>
<p th:text="'Your age is: ' + ${user.age}"></p>
<p th:text="'Your new email is: ' + ${user.email}"></p>

<p th:if="${user.isOver18}">
    You are over 18 years old
</p>
<p th:unless="${user.isOver18}">
    You are not over 18 years old
</p>
</body>
</html>
