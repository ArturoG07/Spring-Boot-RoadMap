services:
  db:
    image: mysql:8
    container_name: bazaar-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bazaar
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    container_name: bazaar-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/bazaar?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER_NAME: admin
      DB_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: